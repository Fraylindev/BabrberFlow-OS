# Keep API runtime, migrator, emergency admin, worker and backup credentials
# distinct. Remote API PostgreSQL URLs require sslaccept=strict, a runtime
# username (with the project ref for Supabase), and no host socket override.
# The API gate rejects missing variables, development Clerk keys in production,
# duplicate TLS options, and localhost/wildcard CORS origins.
# staging/production requires NODE_ENV=production. Security switches must use
# literal true/false strings without leading or trailing whitespace.
