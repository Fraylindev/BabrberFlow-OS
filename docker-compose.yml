name: barberflow-os

services:

  postgres:
    image: postgres:16
    container_name: barberflow-postgres
    restart: always

    environment:
      POSTGRES_USER: barberflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the ignored root .env}
      POSTGRES_DB: barberflow

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
