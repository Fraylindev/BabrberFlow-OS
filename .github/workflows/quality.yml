name: Quality gates

on:
  pull_request:
    branches: [main, ai/antigravity-qa]
  push:
    branches: [ai/antigravity-qa]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kortek_ci_runner:ci-runner-only@127.0.0.1:5432/kortek_ci_test?schema=public
      E2E_PRIMARY_DATABASE_NAME: barberflow
      E2E_PRIMARY_DATABASE_USER: barberflow_runtime
      NODE_ENV: test
      DEPLOY_ENV: development
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      # Placeholder sin capacidad; evita modo keyless en el smoke público.
      CLERK_SECRET_KEY: sk_test_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated PostgreSQL database and role
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
          CREATE ROLE kortek_ci_runner LOGIN PASSWORD 'ci-runner-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION;
          CREATE DATABASE kortek_ci_test OWNER kortek_ci_runner;
          SQL

      - name: Dependency and peer audit
        run: |
          pnpm audit --prod
          pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Prisma contract and generated client
        run: |
          pnpm --filter api exec prisma validate
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api exec prisma migrate status
          pnpm --filter api exec prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Runtime privilege matrix gate
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          # Migrate a separate database as the required function owner.
          # The E2E runner's database and ownership remain unchanged.
          KORTEK_CI_MIGRATOR_PASSWORD="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$KORTEK_CI_MIGRATOR_PASSWORD"
          printf "CREATE ROLE kortek_migrator LOGIN PASSWORD '%s' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;\n" "$KORTEK_CI_MIGRATOR_PASSWORD" \
            | psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1
          psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE kortek_ci_grants_test OWNER kortek_migrator'
          DATABASE_URL="postgresql://kortek_migrator:${KORTEK_CI_MIGRATOR_PASSWORD}@127.0.0.1:5432/kortek_ci_grants_test?schema=public" \
            pnpm --filter api exec prisma migrate deploy
          unset KORTEK_CI_MIGRATOR_PASSWORD
          psql -h 127.0.0.1 -U postgres -d kortek_ci_grants_test -X -v ON_ERROR_STOP=1 \
            -f apps/api/ops/provision-database-roles.sql
          KORTEK_CI_RUNTIME_PASSWORD="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$KORTEK_CI_RUNTIME_PASSWORD"
          printf "ALTER ROLE kortek_runtime PASSWORD '%s';\n" "$KORTEK_CI_RUNTIME_PASSWORD" \
            | psql -h 127.0.0.1 -U postgres -d kortek_ci_grants_test -X -v ON_ERROR_STOP=1
          PGPASSWORD="$KORTEK_CI_RUNTIME_PASSWORD" \
            psql -h 127.0.0.1 -U kortek_runtime -d kortek_ci_grants_test -X -v ON_ERROR_STOP=1 \
              -f apps/api/ops/verify-runtime-role.sql
          unset KORTEK_CI_RUNTIME_PASSWORD

      - name: TypeScript and lint
        run: |
          pnpm --filter api type-check
          pnpm --filter web type-check:clean
          pnpm --filter api lint
          pnpm --filter web lint

      - name: Unit and component tests
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$JWT_SECRET"
          export JWT_SECRET
          pnpm --filter api test --runInBand
          pnpm --filter web test
          unset JWT_SECRET

      - name: Production builds
        run: |
          pnpm --filter api build
          pnpm --filter web build

      - name: PostgreSQL integrity and isolated E2E
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$JWT_SECRET"
          export JWT_SECRET
          node apps/api/dist/prisma/verify-integrity.cli.js
          pnpm --filter api test:e2e --runInBand
          unset JWT_SECRET

      - name: Browser smoke tests
        run: pnpm --filter web test:browser
